name: Build (artifacts only, no release)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Since June 2026 the windows-2025 label is the Windows Server 2025 image with
    # Visual Studio 2026 (windows-2025-vs2026 points to the same image).
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # DLLs: 32-bit (Win32), static CRT, as in build.bat.
      # Same generator as build.bat. CMAKE_POLICY_VERSION_MINIMUM guards against
      # CMake 4.x rejecting the old cmake_minimum_required of the fetched dependencies.
      - name: Configure (Win32)
        # Passed as an environment variable: PowerShell splits "-D...=3.5" at the dot.
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A Win32

      - name: Build Release (wow_optimize.dll, version.dll)
        run: cmake --build build --config Release --parallel

      # Launcher: same csc.exe call as step [4/4] of build.bat.
      # cmd is used on purpose: PowerShell would split the comma in /resource:.
      - name: Build launcher (wow_optimize_launcher.exe)
        shell: cmd
        run: |
          set FW=C:\Windows\Microsoft.NET\Framework\v4.0.30319
          "%FW%\csc.exe" /noconfig /nowarn:1701,1702 /nostdlib+ /warn:4 /define:TRACE ^
            /reference:"%FW%\mscorlib.dll" ^
            /reference:"%FW%\System.Core.dll" ^
            /reference:"%FW%\System.dll" ^
            /reference:"%FW%\System.Drawing.dll" ^
            /reference:"%FW%\System.Windows.Forms.dll" ^
            /resource:src\launcher\wotlk_background.jpg,wotlk_background.jpg ^
            /target:winexe ^
            /out:build\Release\wow_optimize_launcher.exe ^
            src\launcher\Launcher.cs
          if errorlevel 1 exit /b 1

      - name: Check outputs
        shell: pwsh
        run: |
          $files = 'wow_optimize.dll','version.dll','wow_optimize.sym','wow_optimize_launcher.exe'
          $missing = $files | Where-Object { -not (Test-Path "build/Release/$_") }
          Get-ChildItem build/Release | Select-Object Name, Length | Format-Table
          if ($missing) { throw "Missing build outputs: $($missing -join ', ')" }

      # Artifact only: nothing is published to Releases.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wow-optimize-${{ github.sha }}
          path: |
            build/Release/wow_optimize.dll
            build/Release/version.dll
            build/Release/wow_optimize_launcher.exe
            build/Release/wow_optimize.sym
          if-no-files-found: error
          retention-days: 14
